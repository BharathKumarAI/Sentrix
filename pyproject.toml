[project]
name = "sentrix-prism"
version = "2.0.0"
description = "Sentrix Autonomous SRE & Incident Governance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.30",
    "greenlet>=3.0.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "mlflow>=2.15.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "google-adk==2.8.0",
    "jsonschema>=4.23.0",
    "google-genai>=2.0.0",
    "sqlglot>=30.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
]
gcp = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-logging>=3.9.0",
    "google-cloud-trace>=1.13.0",
]
aws = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
k8s = [
    "kubernetes>=29.0.0",
]
all = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-logging>=3.9.0",
    "google-cloud-trace>=1.13.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "kubernetes>=29.0.0",
]
